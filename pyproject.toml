[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "character-chat-local"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.116,<1", "httpx>=0.28,<1", "pydantic>=2.11,<3", "uvicorn>=0.35,<1"]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "pytest-asyncio>=1.1,<2", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/character_chat_local"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
