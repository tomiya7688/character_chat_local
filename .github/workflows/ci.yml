name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect components
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.components.outputs.backend }}
      frontend: ${{ steps.components.outputs.frontend }}
      tauri: ${{ steps.components.outputs.tauri }}
    steps:
      - uses: actions/checkout@v4
      - id: components
        shell: bash
        run: |
          if [[ -f pyproject.toml ]]; then echo "backend=true" >> "$GITHUB_OUTPUT"; else echo "backend=false" >> "$GITHUB_OUTPUT"; fi
          if [[ -f frontend/package.json ]]; then echo "frontend=true" >> "$GITHUB_OUTPUT"; else echo "frontend=false" >> "$GITHUB_OUTPUT"; fi
          if [[ -f src-tauri/Cargo.toml ]]; then echo "tauri=true" >> "$GITHUB_OUTPUT"; else echo "tauri=false" >> "$GITHUB_OUTPUT"; fi

  backend:
    name: Backend / Python ${{ matrix.python-version }}
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Ruff lint
        run: python -m ruff check .
      - name: Ruff format check
        run: python -m ruff format --check .
      - name: Pytest
        run: python -m pytest -q

  frontend:
    name: Frontend / TypeScript
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        shell: bash
        run: |
          if [[ -f package-lock.json ]]; then
            npm ci
          elif [[ -f pnpm-lock.yaml ]]; then
            corepack enable
            pnpm install --frozen-lockfile
          elif [[ -f yarn.lock ]]; then
            corepack enable
            yarn install --immutable
          else
            echo "::error::frontend requires package-lock.json, pnpm-lock.yaml, or yarn.lock"
            exit 1
          fi
      - name: Lint
        shell: bash
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts?.lint ? 0 : 1)"; then
            if [[ -f package-lock.json ]]; then npm run lint; elif [[ -f pnpm-lock.yaml ]]; then pnpm run lint; else yarn lint; fi
          fi
      - name: Type check
        shell: bash
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts?.typecheck ? 0 : 1)"; then
            if [[ -f package-lock.json ]]; then npm run typecheck; elif [[ -f pnpm-lock.yaml ]]; then pnpm run typecheck; else yarn typecheck; fi
          fi
      - name: Test
        shell: bash
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts?.test ? 0 : 1)"; then
            if [[ -f package-lock.json ]]; then npm test; elif [[ -f pnpm-lock.yaml ]]; then pnpm test; else yarn test; fi
          fi
      - name: Build WebUI
        shell: bash
        run: |
          if ! node -e "const p=require('./package.json'); process.exit(p.scripts?.build ? 0 : 1)"; then
            echo "::error::frontend/package.json must define a build script"
            exit 1
          fi
          if [[ -f package-lock.json ]]; then npm run build; elif [[ -f pnpm-lock.yaml ]]; then pnpm run build; else yarn build; fi

  tauri:
    name: Tauri / Rust
    needs: detect
    if: needs.detect.outputs.tauri == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Rust format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets --all-features

  ci-gate:
    name: CI Gate
    if: ${{ always() }}
    needs: [detect, backend, frontend, tauri]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required jobs
        env:
          DETECT_RESULT: ${{ needs.detect.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          TAURI_RESULT: ${{ needs.tauri.result }}
        shell: bash
        run: |
          for result in "$DETECT_RESULT" "$BACKEND_RESULT" "$FRONTEND_RESULT" "$TAURI_RESULT"; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "CI component failed: $result"
              exit 1
            fi
          done
          echo "All present components passed CI. Missing components were skipped."
